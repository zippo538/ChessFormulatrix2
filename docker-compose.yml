services:
  chess-web:
    build:
      context: ./ChessFormulatrix.View/chess-arena-frontend
      dockerfile: Dockerfile
    container_name: chess-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy_network

  chess-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    expose:
      - "8080"
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
